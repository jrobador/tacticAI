# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: tacticai
infra:
  provider: bicep
  path: deploy/infra
services:
  api:
    project: .
    host: containerapp
    language: python
    docker:
      path: deploy/api.Dockerfile
      context: .
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./deploy/postprovision.ps1
    posix:
      shell: sh
      run: ./deploy/postprovision.sh
