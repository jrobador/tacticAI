[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tacticai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "pydantic>=2,<3", "pillow>=10.1"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]", "python-dotenv", "pydantic>=2,<3", "azure-identity", "azure-mgmt-appcontainers", "mcp>=1.2,<2", "azure-monitor-opentelemetry==1.8.1"]
agents = ["agent-framework-core==1.23.0", "agent-framework-openai==1.17.0"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tacticai.interpret" = ["models/*.json"]
"tacticai.render" = ["brands/*.json"]
